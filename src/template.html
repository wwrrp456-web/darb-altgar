}

  :root:not([data-theme="light"]){--bg:#252d33;--card:#303c45;--ink:#f4ede2;--muted:#bac4c9;--resource-label:#bac4c9;--line:#56646c;--sea:#354f5d;--sand:#414b50;--teal:#a1c0ce;--teal2:#bfd4dc;--hud-start:#344650;--hud-end:#2b3942;--hud-surface:#35434d;--hud-line:#617480;--resource-sar:#43463a;--resource-usd:#354946;--resource-gold:#4b4434;--resource-load:#364958;--accent-soft:#485f6e;--accent-ink:#f4ede2;--gold-ink:#efc985;--progress-track:#586875;--sky1:#4a3a2c;--sky2:#7a4a2a;--dune1:#5b4a2a;--dune2:#4a3b20;--good-bg:#1f3a28;--good-ink:#9fe0b4;--bad-bg:#44201a;--bad-ink:#f0a99d;--on-teal:#203640;color-scheme:dark}
}

@media(max-width:760px){
 #nav{padding-top:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px))}

.map-panel{min-width:0}.map-panel .citycard{border-radius:18px}.map-compass{position:absolute;top:10px;left:12px;color:#fff3cb;text-align:center;line-height:1.2;font:12px Georgia,serif;pointer-events:none;text-shadow:0 1px 3px #123}.map-compass img{display:block;width:36px;height:36px;object-fit:contain}

.gcard .ic{font-size:34px;line-height:1}

.ach{display:flex;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);opacity:.62}.ach.on{opacity:1}.medal{flex:none;width:34px;height:34px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:700;color:#fff;border:2px solid rgba(0,0,0,.12)}.medal img{width:24px;height:24px}.medal.t-b{background:#b87a43}.medal.t-s{background:#8e9aa3}.medal.t-g{background:#d19a2a}.medal.on::after{content:'';width:16px;height:16px;background:#fff;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}.medal:has(img)::after{display:none}.medal.off{background:var(--line);border-style:dashed}
