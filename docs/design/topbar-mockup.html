<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>درب التجّار — الشريط العلوي (النموذج المعتمد)</title>
<!-- نموذج كيمي، الجولة الثانية، اعتمده بن محمود 2026-11-04. مرجع بصري فقط؛ المواصفة: docs/design/TOPBAR_SPEC.md -->
<style>
:root{--navy:#476b7e;--navy-deep:#162638;--ivory:#fbf6ed;--ivory-2:#dce8ec;--gold:#b98a43;--gold-soft:#f2e3c7;--ink:#343f46;--muted:#5e6b72;--line:#cbd8dc;--resource:#f8fbfc;--white:#fffdf7}
*{box-sizing:border-box;margin:0;padding:0}
html{min-height:100%;background:#d9b77d}
body{min-height:100dvh;padding:32px 16px 64px;color:var(--ink);font-family:Tahoma,Arial,sans-serif;background:radial-gradient(circle at 18% 8%,#f8ddb0 0 42px,transparent 43px),linear-gradient(180deg,#9eafb7 0%,#d8c5a5 35%,#d9b77d 100%);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
button:active{transform:scale(.96)}
.showcase{width:100%;max-width:460px;margin-inline:auto;display:grid;gap:32px}
.case-title{margin:0 4px 12px;font-size:15px;line-height:1.5;font-weight:700;color:#263b47}
.phone{position:relative;width:100%;max-width:390px;margin-inline:auto;container-type:inline-size}
.scene{position:relative;min-height:152px;padding-bottom:12px;overflow:hidden;border-radius:0 0 24px 24px;background:radial-gradient(ellipse at 15% 115%,#c79554 0 42%,transparent 43%),radial-gradient(ellipse at 90% 120%,#e3c28c 0 56%,transparent 57%),linear-gradient(180deg,#b4c1c6 0%,#e8cfaa 76%,#d7ad70 100%);box-shadow:0 12px 28px rgb(49 39 25 / .16)}
.topbar{position:relative;z-index:2;width:100%;height:96px;padding:3px 12px;display:grid;grid-template-rows:52px 32px;gap:6px;overflow:hidden;color:var(--ink);background:color-mix(in srgb,var(--ivory) 85%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:0 2px 8px rgb(0 0 0 / .08);transition:height 200ms ease-out}
.identity-row{min-width:0;display:grid;grid-template-columns:48px minmax(0,1fr) auto auto 36px;align-items:center;gap:8px}
.avatar{position:relative;width:48px;height:48px;flex:none;border:2px solid var(--gold);border-radius:50%;display:grid;place-items:center;color:var(--white);background:var(--navy);font-size:15px;font-weight:800}
.level{position:absolute;left:-2px;bottom:-2px;width:20px;height:20px;border:2px solid var(--ivory);border-radius:50%;display:grid;place-items:center;color:#fff;background:var(--navy);font-size:11px;font-weight:700;line-height:1}
.rank{align-self:center;min-width:0}
.rank-name{display:block;overflow:hidden;color:var(--ink);font-size:15px;font-weight:700;line-height:20px;text-overflow:ellipsis;white-space:nowrap}
.progress{width:100%;height:4px;margin-top:4px;overflow:hidden;border-radius:999px;background:var(--ivory-2)}
.progress>i{display:block;width:var(--progress);height:100%;border-radius:inherit;background:var(--gold)}
.wealth{position:relative;height:28px;padding:0 10px;border:0;border-radius:999px;display:flex;align-items:center;gap:8px;background:var(--gold-soft);white-space:nowrap}
.wealth::after,.resource-info::after,.bell::after{content:"";position:absolute;inset:-8px 0}
.icon{width:18px;height:18px;display:inline-grid;place-items:center;flex:none;font-size:15px;font-weight:800;line-height:1}
.num{direction:ltr;unicode-bidi:isolate;font-family:Arial,Tahoma,sans-serif;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.wealth .num{color:#815b2d;font-size:15px;font-weight:800}
.date{min-width:0;height:44px;padding:0;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:transparent;white-space:nowrap}
.date-day{font-size:13px;font-weight:700;line-height:18px}
.date-year{color:var(--muted);font-size:11px;line-height:16px}
.pause{position:relative;width:36px;height:36px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--resource) 90%,transparent);font-size:15px;font-weight:800}
.pause::after{content:"";position:absolute;inset:-4px}
.speed-dot{position:absolute;left:0;bottom:1px;width:6px;height:6px;border-radius:50%;background:#39825b;box-shadow:0 0 0 2px var(--ivory)}
.pause[aria-pressed="true"] .speed-dot{background:#7b8184}
.resource-row{min-width:0;padding-left:44px;display:flex;align-items:center;gap:8px;transition:opacity 160ms ease-out,transform 160ms ease-out}
.pill{position:relative;min-width:64px;height:32px;padding:0 8px;border:1px solid var(--line);border-radius:999px;display:flex;align-items:center;gap:4px;flex:none;background:color-mix(in srgb,var(--resource) 90%,transparent)}
.pill.current-currency{border:2px solid var(--gold);background:color-mix(in srgb,var(--gold-soft) 82%,transparent)}
.resource-info{position:relative;min-width:0;height:32px;padding:0;border:0;display:flex;align-items:center;gap:4px;background:transparent;white-space:nowrap}
.plus{position:relative;width:20px;height:20px;margin-inline-start:auto;border:0;border-radius:50%;display:grid;place-items:center;flex:none;color:#fff;background:var(--gold);font-size:12px;font-weight:800;line-height:1}
.plus::after{content:"";position:absolute;inset:-12px}
.overflow-pill{padding:0 10px;justify-content:center;color:var(--ink);font-size:14px;font-weight:700}
.bell{position:absolute;top:55px;left:12px;width:36px;height:36px;padding:0;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--resource) 90%,transparent)}
.bell svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.money-icon{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.coin-icon{color:#a4742f;fill:#e7bd62;stroke:#8b6429}
.cash-icon{color:#28724c;fill:#b9dfb9;stroke:#28724c}
.advanced-row{gap:4px}
.advanced-row .money-icon,.advanced-row .resource-info>.icon{width:16px;height:16px}
.advanced-row .plus{width:18px;height:18px}
.overflow-wide{display:inline}.overflow-narrow{display:none}
.badge{position:absolute;top:-2px;left:-2px;min-width:16px;height:16px;padding:0 3px;border-radius:999px;display:grid;place-items:center;color:#fff;background:#9b3e36;font-size:11px;font-weight:700;line-height:1}
.drawer-toggle{position:relative;z-index:3;width:44px;height:44px;margin:0 auto;border:0;display:grid;place-items:center;background:transparent}
.drawer-toggle>span{align-self:start;width:36px;height:20px;border:1px solid rgb(71 107 126 / .28);border-top:0;border-radius:0 0 12px 12px;display:grid;place-items:center;color:var(--navy);background:color-mix(in srgb,var(--ivory) 88%,transparent);box-shadow:0 2px 8px rgb(0 0 0 / .08);font-size:15px;line-height:1;transition:color 180ms ease-out}
.drawer-toggle[aria-expanded="true"]>span{color:var(--gold)}
.drawer{position:absolute;z-index:5;top:136px;right:12px;left:12px;padding:12px 16px;border:1px solid var(--line);border-radius:12px;color:var(--ink);background:var(--white);box-shadow:0 8px 24px rgb(22 38 56 / .18);font-size:13px;font-weight:700;line-height:1.7}
.drawer[hidden]{display:none}
.topbar.collapsed{height:52px;grid-template-rows:52px;padding-block:0}
.topbar.collapsed .resource-row{opacity:0;transform:translateY(-8px);pointer-events:none;visibility:hidden}
.tooltip{position:fixed;z-index:10;max-width:calc(100vw - 32px);padding:8px 12px;border-radius:8px;color:var(--ivory);background:var(--navy-deep);box-shadow:0 4px 16px rgb(0 0 0 / .2);font-size:13px;font-weight:700;direction:ltr;pointer-events:none}
.tooltip[hidden]{display:none}
@media (max-width:420px){body{padding:24px 0 48px}.case-title{margin-inline:16px}}
@container (max-width:374px){.identity-row{grid-template-columns:48px minmax(0,1fr) auto auto 36px;gap:4px}.topbar{padding-inline:8px}.resource-row{gap:4px;padding-left:40px}.bell{left:8px}.advanced-row .load-pill{display:none}.advanced-row .overflow-wide{display:none}.advanced-row .overflow-narrow{display:inline}.rank-name{font-size:13px}.date-day{font-size:11px}.wealth{padding-inline:8px;gap:4px}}
@media (prefers-color-scheme:dark){.topbar{color:var(--ivory);background:color-mix(in srgb,var(--navy-deep) 85%,transparent)}.rank-name,.wealth .num,.overflow-pill{color:var(--ivory)}.date-year{color:#dce8ec}.wealth{background:rgb(185 138 67 / .38)}.pill,.pause,.bell{border-color:#607582;background:rgb(251 246 237 / .12)}.progress{background:#50636d}.level{border-color:var(--navy-deep)}.speed-dot{box-shadow:0 0 0 2px var(--navy-deep)}.drawer{color:var(--ivory);background:var(--navy-deep);border-color:#607582}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main class="showcase" aria-label="حالة الشريط العلوي المعتمدة">
<section>
<h1 class="case-title">متقدم · الرياض (المعتمد)</h1>
<div class="phone"><div class="scene">
<header class="topbar" aria-label="الشريط العلوي — لاعب متقدم">
<div class="identity-row">
<div class="avatar" aria-label="صورة اللاعب">ت<span class="level">18</span></div>
<div class="rank"><span class="rank-name">سيّد التجّار</span><div class="progress" style="--progress:84%"><i></i></div></div>
<button class="wealth" data-open="أين أقف: الثروة الكاملة 88,000,000" aria-label="الثروة 88 مليوناً — أين أقف"><svg class="money-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4h6l-1 4H10L9 4Z"/><path d="M10 8c-4 2-6 5-6 8 0 3 3 4 8 4s8-1 8-4c0-3-2-6-6-8H10Z"/><path d="M9 13h6m-3-3v6"/></svg><span class="num" data-full="88,000,000">88M</span></button>
<button class="date" data-open="التقويم: 12 رمضان / 1448 هـ" aria-label="فتح التقويم"><span class="date-day">12 رمضان</span><span class="date-year">1448 هـ</span></button>
<button class="pause" data-pause aria-pressed="false" aria-label="إيقاف الوقت"><span class="pause-symbol">Ⅱ</span><i class="speed-dot"></i></button>
</div>
<div class="resource-row advanced-row">
<div class="pill current-currency"><button class="resource-info" data-open="الرياض — الريال: 1,300,000" aria-label="الريال 1.3 مليون، عملة الرياض الحالية"><svg class="money-icon coin-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M9 8v8m0-7h3.5a2 2 0 0 1 0 4H9m0 3h5" fill="none"/></svg><span class="num" data-full="1,300,000">1.3M</span></button><button class="plus" data-open="الحصّالة والصرافة" aria-label="فتح الحصالة والصرافة">+</button></div>
<div class="pill"><button class="resource-info" data-open="الدولار: 240,000" aria-label="الدولار 240 ألفاً"><svg class="money-icon cash-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5" fill="none"/><path d="M6 9h1m10 6h1" fill="none"/></svg><span class="num" data-full="240,000">240K</span></button><button class="plus" data-open="الحصّالة والصرافة" aria-label="فتح الصرافة بالدولار">+</button></div>
<div class="pill load-pill"><button class="resource-info" data-open="حمولة القافلة: 0/1,000" aria-label="الحمولة 0 من ألف"><span class="icon">▣</span><span class="num">0/1K</span></button><button class="plus" data-open="السوق" aria-label="فتح السوق">+</button></div>
<button class="pill overflow-pill" data-open="الموارد الإضافية — الحول: 111 يوماً · الذهب: 15" aria-label="فتح موردين إضافيين: الحول والذهب">⋯ <span class="overflow-wide">+2</span><span class="overflow-narrow">+3</span></button>
<button class="bell" data-open="ثلاثة تنبيهات" aria-label="ثلاثة تنبيهات"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 16V11a5 5 0 0 1 10 0v5l2 2H5l2-2Z"/><path d="M10 20h4"/></svg><span class="badge">3</span></button>
</div>
</header>
<button class="drawer-toggle" aria-expanded="false" aria-label="فتح درج التفاصيل"><span>⌄</span></button>
<div class="drawer" role="status" hidden>الحول: 111 يوماً · الذهب: 15</div>
</div></div>
</section>
</main>
<div class="tooltip" role="tooltip" hidden></div>
</body>
</html>
